<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNBIM – journal de bord IA et projet de groupe</title>
<meta name="description" content="Module de 8 heures, Manager de projets BTP, ESCT Nantes : un chantier fictif commun, un projet de groupe parmi quatre et un journal de bord IA tracé.">
<meta name="robots" content="noindex">
<style>
:root{
  --fond:#F8FAFC; --carte:#FFFFFF; --encre:#0F172A; --texte:#334155; --discret:#64748B;
  --trait:#E2E8F0; --trait-fort:#CBD5E1; --creux:#F1F5F9;
  --accent:#059669; --accent-fonce:#047857; --accent-nuit:#065F46; --accent-pale:#ECFDF5; --accent-trait:#A7F3D0;
  --rouge:#B91C1C; --rouge-pale:#FEF2F2; --rouge-trait:#FECACA;
  --ambre:#B45309; --ambre-pale:#FFFBEB; --ambre-trait:#FDE68A;
  --sans:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --nav:280px; --etat:300px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--sans);font-size:16px;line-height:1.55}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent-fonce);text-underline-offset:3px}
a:hover{color:var(--accent-nuit)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
[hidden]{display:none!important}

/* Panneaux flottants */
.flottant{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--trait-fort)}

/* Barre d'actions, en haut à gauche */
.colonne{position:fixed;z-index:40;top:12px;left:12px;bottom:12px;width:var(--nav);display:flex;flex-direction:column;gap:8px}
.barre{padding:8px}
.barre-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.barre-actions button{height:32px;padding:0 6px;font-size:12.5px;font-weight:600;background:var(--carte);border:1px solid var(--trait-fort);cursor:pointer;white-space:nowrap}
.barre-actions button:hover{border-color:var(--accent);color:var(--accent-nuit)}
.barre-actions button.plein{background:var(--accent-fonce);border-color:var(--accent-fonce);color:#fff}
.barre-actions button.plein:hover{background:var(--accent-nuit);color:#fff}
.barre-etat{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--discret);line-height:1.3}
.barre-etat i{flex:none;width:8px;height:8px;background:var(--accent)}
.barre-etat.alerte i{background:var(--ambre)}
.barre-mobile{display:none}

/* Navigation */
.nav{flex:1;min-height:0;overflow:auto;padding:6px 0 12px}
.nav h2{font-size:12.5px;font-weight:600;color:var(--discret);padding:14px 14px 6px}
.nav a{display:flex;align-items:baseline;gap:8px;padding:8px 14px;color:var(--texte);text-decoration:none;font-size:14.5px;line-height:1.3;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.9)}
.nav a[aria-current="page"]{background:var(--carte);border-left-color:var(--accent);color:var(--encre);font-weight:600}
.nav a span{flex:1}
.nav a small{flex:none;font-size:12px;color:var(--discret);font-weight:400;font-variant-numeric:tabular-nums}
.nav a.complet small{color:var(--accent-fonce);font-weight:600}
.nav-global{margin:14px 14px 0;font-size:12.5px;color:var(--discret)}
.nav-global b{color:var(--encre)}
.filet{height:6px;background:var(--trait);margin-top:6px}
.filet i{display:block;height:100%;background:var(--accent)}

/* Zone principale */
main{margin:0 calc(var(--etat) + 36px) 0 calc(var(--nav) + 36px);padding:28px 0 120px;min-height:100vh}
.page{max-width:760px;margin:0 auto}
.tete{padding:8px 0 22px}
.tete .seance{font-size:14px;color:var(--discret)}
.tete h1{font-size:clamp(28px,3.4vw,38px);line-height:1.08;letter-spacing:-.022em;font-weight:700;color:var(--encre);margin:6px 0 12px;text-wrap:balance}
.tete .chapo{font-size:18px;line-height:1.5;color:var(--texte);max-width:62ch}

.bloc{background:var(--carte);border:1px solid var(--trait);padding:20px 22px;margin-bottom:14px}
.bloc h2{font-size:19px;line-height:1.25;color:var(--encre);font-weight:650;letter-spacing:-.01em}
.bloc h3{font-size:15.5px;color:var(--encre);font-weight:650;margin-top:18px}
.bloc p{margin-top:10px;max-width:68ch}
.bloc p:first-child{margin-top:0}
.bloc ul.tirets{margin-top:10px}
.bloc ul.tirets li{position:relative;padding-left:22px;margin-top:5px;max-width:66ch}
.bloc ul.tirets li::before{content:"–";position:absolute;left:4px;color:var(--accent-fonce);font-weight:700}
.bloc ol.pas{counter-reset:pas;margin-top:12px}
.bloc ol.pas>li{counter-increment:pas;position:relative;padding-left:34px;margin-top:9px;max-width:66ch}
.bloc ol.pas>li::before{content:counter(pas);position:absolute;left:0;top:1px;width:22px;height:22px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--accent-nuit);background:var(--accent-pale);border:1px solid var(--accent-trait)}
.note{font-size:14px;color:var(--discret)}
.duree{font-size:13px;color:var(--discret);font-weight:400;margin-left:8px;white-space:nowrap}

/* Étape à cocher */
.etape{border-left:3px solid var(--trait-fort)}
.etape.faite{border-left-color:var(--accent)}
.etape-tete{display:flex;align-items:flex-start;gap:14px;justify-content:space-between}
.fait{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--discret);cursor:pointer;user-select:none;padding:4px 9px;border:1px solid var(--trait-fort);background:var(--carte)}
.fait input{appearance:none;-webkit-appearance:none;width:14px;height:14px;margin:0;border:1.5px solid var(--discret);background:#fff;display:grid;place-items:center;cursor:pointer}
.fait input:checked{background:var(--accent-fonce);border-color:var(--accent-fonce)}
.fait input:checked::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.etape.faite .fait{color:var(--accent-nuit);border-color:var(--accent-trait);background:var(--accent-pale)}

/* Repère */
.repere{background:var(--accent-pale);border:1px solid var(--accent-trait);border-left:3px solid var(--accent)}
.repere h2{font-size:16.5px}
.repere .verif{font-size:13px;color:var(--accent-nuit);margin-top:12px}
.sources{margin-top:12px;font-size:14px}
.sources li{margin-top:4px;padding-left:22px;position:relative}
.sources li::before{content:"↗";position:absolute;left:3px;color:var(--accent-fonce)}

/* Champs */
.champs{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:14px}
.champ{display:flex;flex-direction:column;gap:5px;min-width:0}
.champ.large{grid-column:1/-1}
.champ>span.l{font-size:14px;font-weight:600;color:var(--encre)}
.champ>span.l em{font-style:normal;font-weight:400;color:var(--discret)}
.champ .aide{font-size:13px;color:var(--discret);line-height:1.4}
.champ input[type=text],.champ input[type=number],.champ input[type=date],.champ textarea,.champ select{width:100%;padding:9px 11px;border:1px solid var(--trait-fort);background:#fff;border-radius:0;line-height:1.45}
.champ textarea{resize:vertical;min-height:72px}
.champ input:focus,.champ textarea:focus,.champ select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.coches{display:grid;gap:6px;margin-top:12px}
.coche{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.coche input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--accent-fonce);flex:none}

/* Consigne à copier */
.consigne{margin-top:14px;border:1px solid var(--trait-fort);background:var(--creux)}
.consigne-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--trait-fort);background:#fff}
.consigne-tete b{font-size:14px;color:var(--encre)}
.consigne pre{margin:0;padding:14px;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;color:var(--encre)}
.consigne pre .vide{color:var(--ambre);background:var(--ambre-pale)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;font-size:14px;font-weight:600;background:var(--carte);border:1px solid var(--trait-fort);cursor:pointer;text-decoration:none;color:var(--encre);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-nuit)}
.btn.plein{background:var(--accent-fonce);border-color:var(--accent-fonce);color:#fff}
.btn.plein:hover{background:var(--accent-nuit);color:#fff}
.btn.ok{background:var(--accent-pale);border-color:var(--accent);color:var(--accent-nuit)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Décision */
.decision{border-top:3px solid var(--encre)}
.decision .q{font-size:19px;font-weight:650;color:var(--encre);line-height:1.25;letter-spacing:-.01em}
.decision .genre{font-size:13px;color:var(--discret);margin-bottom:4px}
.options{display:grid;gap:8px;margin-top:14px}
.option{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--trait-fort);background:#fff;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option input{margin:4px 0 0;accent-color:var(--accent-fonce);width:16px;height:16px;flex:none}
.option.choisi{border-color:var(--accent);background:var(--accent-pale);box-shadow:inset 3px 0 0 var(--accent)}
.suite{margin-top:14px;padding:12px 14px;background:var(--creux);border-left:3px solid var(--encre)}
.suite.grave{background:var(--rouge-pale);border-left-color:var(--rouge);color:#7F1D1D}
.effets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.effet{font-size:12.5px;font-weight:600;padding:2px 8px;border:1px solid var(--trait-fort);background:#fff;font-variant-numeric:tabular-nums}
.effet.bon{border-color:var(--accent-trait);color:var(--accent-nuit);background:var(--accent-pale)}
.effet.mauvais{border-color:var(--rouge-trait);color:var(--rouge);background:var(--rouge-pale)}

/* Scène */
.scene{background:var(--encre);border-color:var(--encre);color:#CBD5E1}
.scene .genre{font-size:13px;color:#94A3B8}
.scene h2{color:#fff;font-size:21px;margin-top:2px}
.scene p{color:#E2E8F0;font-size:16.5px}
.scene .reps{display:grid;gap:8px;margin-top:16px}
.scene .rep{text-align:left;padding:11px 14px;background:transparent;border:1px solid #475569;color:#F1F5F9;cursor:pointer;line-height:1.4}
.scene .rep:hover{border-color:#6EE7B7}
.scene .rep.choisi{background:var(--accent-fonce);border-color:var(--accent-fonce);color:#fff}
.scene .suite{background:#1E293B;border-left-color:#6EE7B7;color:#E2E8F0}
.scene .effet{background:#1E293B;border-color:#475569;color:#E2E8F0}
.scene .effet.bon{color:#6EE7B7;border-color:#065F46;background:#1E293B}
.scene .effet.mauvais{color:#FCA5A5;border-color:#7F1D1D;background:#1E293B}
.scene .verrou{color:#94A3B8;font-size:15px}
.scene .champ>span.l{color:#fff}
.scene .champ textarea{background:#fff;color:var(--encre)}
.scene :focus-visible{outline-color:#6EE7B7}

/* Schéma */
.schema{margin-top:14px;border:1px solid var(--trait-fort);background:#fff}
.schema svg{display:block;width:100%;height:auto;background:var(--fond)}
.schema img{display:block;width:100%;height:auto;border-top:1px solid var(--trait-fort)}
.schema figcaption{padding:12px 14px;border-top:1px solid var(--trait-fort);font-size:14.5px}
.schema figcaption ol{counter-reset:leg}
.schema figcaption li{counter-increment:leg;position:relative;padding-left:30px;margin-top:5px}
.schema figcaption li::before{content:counter(leg);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent-fonce);color:#fff;font-size:12px;font-weight:700}
.schema figcaption .note{margin-top:9px}

/* Tableaux */
.tab{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.tab th{text-align:left;font-weight:600;color:var(--encre);padding:7px 8px;border-bottom:2px solid var(--encre);vertical-align:bottom;line-height:1.25}
.tab td{padding:6px 6px;border-bottom:1px solid var(--trait);vertical-align:top}
.tab td input,.tab td textarea,.tab td select{width:100%;padding:7px 8px;border:1px solid var(--trait-fort);background:#fff;border-radius:0;font-size:14px;line-height:1.4}
.tab td textarea{resize:vertical;min-height:54px}
.tab.donnees{font-family:var(--mono);font-size:12px}
.tab.donnees th{font-weight:600;border-bottom-width:1px}
.defile{overflow-x:auto}

/* Idées */
.idees{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.idee{border:1px solid var(--trait-fort);padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.idee.choisie{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.idee .fam{font-size:12.5px;color:var(--discret)}
.idee h3{margin:0;font-size:16px}
.idee p{margin:0;font-size:14px;line-height:1.45}
.idee .niv{display:flex;gap:3px;align-items:center;font-size:12.5px;color:var(--discret)}
.idee .niv i{width:14px;height:6px;background:var(--trait)}
.idee .niv i.on{background:var(--accent)}
.idee .btn{align-self:flex-start;margin-top:auto}

/* Parcours des deux séances */
.parcours{margin-top:14px;border-left:3px solid var(--accent)}
.parcours li{padding:10px 0 10px 18px;border-bottom:1px solid var(--trait);position:relative}
.parcours li:last-child{border-bottom:0}
.parcours li::before{content:"";position:absolute;left:-8px;top:17px;width:13px;height:13px;background:var(--accent)}
.parcours li.entre::before{background:#fff;border:3px solid var(--accent)}
.parcours b{display:block;color:var(--encre)}

/* Résultats chiffrés */
.resultats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid var(--trait-fort)}
.resultats div{padding:12px 14px;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait);background:#fff}
.resultats div:nth-child(3n){border-right:0}
.resultats dt{font-size:13px;color:var(--discret);line-height:1.3}
.resultats dd{margin:4px 0 0;font-size:22px;font-weight:700;color:var(--encre);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.resultats dd.neg{color:var(--rouge)}
.resultats dd small{font-size:13px;font-weight:400;color:var(--discret)}

/* État du projet */
.etat{position:fixed;z-index:30;top:12px;right:12px;width:var(--etat);max-height:calc(100vh - 24px);overflow:auto;padding:16px}
.etat h2{font-size:15px;color:var(--encre);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.etat h2 button{display:none}
.jauge{margin-top:14px}
.jauge-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.jauge-l b{color:var(--encre);font-weight:650}
.jauge-l span{color:var(--discret);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:5px}
.seg i{height:10px;background:var(--trait)}
.seg.vert i.on{background:var(--accent)}
.seg.neutre i.on{background:#475569}
.seg.ambre i.on{background:#D97706}
.seg.rouge i.on{background:var(--rouge)}
.jauge small{display:block;font-size:12px;color:var(--discret);margin-top:3px}
.etat h3{font-size:13.5px;color:var(--encre);margin-top:18px;padding-top:12px;border-top:1px solid var(--trait-fort)}
.alertes{margin-top:8px;display:grid;gap:6px}
.alerte{display:block;font-size:13px;line-height:1.4;padding:8px 10px;border:1px solid var(--trait-fort);border-left-width:3px;background:#fff;text-decoration:none;color:var(--texte)}
.alerte.rouge{border-color:var(--rouge-trait);border-left-color:var(--rouge);background:var(--rouge-pale);color:#7F1D1D}
.alerte.orange{border-color:var(--ambre-trait);border-left-color:var(--ambre);background:var(--ambre-pale);color:#78350F}
.alerte.info{border-left-color:var(--discret)}
a.alerte:hover{border-color:var(--encre)}
.calme{font-size:13px;color:var(--discret);margin-top:8px}
.bouton-etat{display:none}

/* Pied de chapitre */
.pied{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* Rappel, message bref, dialogue */
.rappel{position:fixed;z-index:50;left:50%;bottom:16px;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-color:var(--ambre);font-size:14.5px;color:var(--encre)}
.rappel div{display:flex;gap:6px;flex:none}
.bref{position:fixed;z-index:60;left:50%;bottom:76px;transform:translateX(-50%);background:var(--encre);color:#fff;padding:8px 14px;font-size:14px;font-weight:600}
dialog{border:1px solid var(--encre);padding:0;width:min(480px,calc(100vw - 32px));border-radius:0;color:var(--texte)}
dialog::backdrop{background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog form{padding:22px}
dialog h2{font-size:19px;color:var(--encre)}
dialog p{margin-top:10px}
dialog .actions{justify-content:flex-end;margin-top:20px}

/* Aperçu du dossier */
.dossier{background:#fff;color:var(--encre);font-size:14.5px;line-height:1.5}
.dossier .couv{border-bottom:3px solid var(--encre);padding-bottom:14px;margin-bottom:18px}
.dossier .couv h1{font-size:26px;line-height:1.15;letter-spacing:-.015em;margin:4px 0 8px}
.dossier .couv p{margin:2px 0;color:var(--texte)}
.dossier h2{font-size:17px;margin:22px 0 8px;padding-top:10px;border-top:1px solid var(--trait-fort);color:var(--encre)}
.dossier h3{font-size:14.5px;margin:12px 0 2px;color:var(--encre)}
.dossier p{margin:3px 0;max-width:none;white-space:pre-wrap;overflow-wrap:anywhere}
.dossier .vide{color:var(--ambre);font-style:italic}
.dossier dl{margin:6px 0;display:grid;grid-template-columns:minmax(150px,32%) 1fr;gap:3px 14px}
.dossier dt{color:var(--discret)}
.dossier dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dossier table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
.dossier th,.dossier td{border:1px solid var(--trait-fort);padding:5px 7px;text-align:left;vertical-align:top;white-space:pre-wrap}
.dossier th{background:var(--creux)}
.dossier .jauges{break-inside:avoid}
.dossier .jg{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:4px 0}
.dossier .jg .seg{margin:0}
.dossier ul{margin:6px 0}
.dossier ul li{padding-left:18px;position:relative;margin:3px 0}
.dossier ul li::before{content:"–";position:absolute;left:2px}
.dossier pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--creux);padding:10px;margin:6px 0;border:1px solid var(--trait)}
#impression{display:none}

/* Écrans moyens : l'état devient un volet */
@media (max-width:1239px){
  main{margin-right:24px}
  .etat{display:none;box-shadow:0 12px 40px rgba(15,23,42,.18)}
  .etat.ouvert{display:block}
  .etat h2 button{display:inline-flex}
  .bouton-etat{display:flex;position:fixed;z-index:29;right:12px;top:12px;align-items:center;gap:8px;height:40px;padding:0 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--encre)}
  .bouton-etat .pastilles{display:flex;gap:3px}
  .bouton-etat .pastilles i{width:8px;height:14px;background:var(--accent)}
  .bouton-etat .pastilles i.neutre{background:#475569}
  .bouton-etat .pastilles i.ambre{background:#D97706}
  .bouton-etat .pastilles i.rouge{background:var(--rouge)}
  .page{padding-top:44px}
}
/* Petits écrans : la navigation devient un volet */

/* Typographie française : espaces insécables, apostrophes, milliers */
function typo(t) {
  return String(t)
    .replace(/(\p{L})'(?=\p{L}|«)/gu, '$1’')
    .replace(/« /g, '« ').replace(/ »/g, ' »')
    .replace(/ ([:;!?])/g, ' $1')
    .replace(/(\d) (\d{3})(?!\d)/g, '$1 $2')
    .replace(/(\d) h (\d)/g, '$1 h $2')
    .replace(/(\d) (%|€|h|min|heures?|minutes?|jours?|semaines?|mois|ans?)(?![\p{L}])/gu, '$1 $2')
    .replace(/n° /g, 'n° ');
}
function typoNoeuds(racine) {
  const marcheur = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentElement;
      if (!p || p.closest('pre,textarea,script,style,[data-brut]')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const noeuds = []; while (marcheur.nextNode()) noeuds.push(marcheur.currentNode);
  noeuds.forEach(n => { const t = typo(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; });
  racine.querySelectorAll('[placeholder]').forEach(e => e.setAttribute('placeholder', typo(e.getAttribute('placeholder'))));
}

function appliquer(j, e) { Object.keys(e || {}).forEach(k => { j[k] = borne(j[k] + e[k]); }); }
function calcul() {
  const j = {}; Object.keys(JAUGES).forEach(k => { j[k] = JAUGES[k].base; });

const texteCompteur = n => n > 0 ? n + ' champ' + (n > 1 ? 's' : '') + ' à remplir' : 'Rempli';
function etape(id, titre, duree, corps) {
  REG.etapes[id] = CH; enreg('e', id, CH, titre);
  const cles = Array.from(new Set((corps.match(/data-champ="([^"]+)"/g) || []).map(s => s.slice(12, -1))));
  cles.forEach(k => { REG.champsEtape[k] = id; });
  const requises = cles.filter(k => REG.champs[k] && REG.champs[k].requis); REG.etapeChamps[id] = requises;
  const nManque = requises.filter(k => !rempli(k)).length;
  const compteur = requises.length ? `<span class="compteur ${nManque ? 'reste' : 'ok'}" data-compteur>${texteCompteur(nManque)}</span>` : '';
  const fac = ENTRAINEMENT.indexOf(id) >= 0; if (fac) REG.facultatives[id] = true;
  const statut = CHAPITRES_MIXTES.indexOf(CH) >= 0 ? (fac ? `<span class="statut facultatif">Entraînement · facultatif</span>` : `<span class="statut obligatoire">Obligatoire</span>`) : '';
  const fait = !!S.faits[id];
  return `<section class="bloc etape${fait ? ' faite' : ''}${fac ? ' entrainement' : ''}" id="e-${id}"${requises.length ? ` data-requis="${requises.join(',')}"` : ''}>
    <div class="etape-tete"><h2>${titre}${duree ? `<span class="duree">${duree}</span>` : ''}${statut}${compteur}</h2>
    <label class="fait"><input type="checkbox" data-fait="${id}"${fait ? ' checked' : ''}>Fait</label></div>
    ${corps}</section>`;
}
/* Aide contextuelle repliable : l'état ouvert ou fermé est gardé en mémoire pendant la visite, pas dans le projet */
const AIDES = {};
const PICTO_AIDE = '<svg class="picto" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/><path d="M10 9v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>';
function aide(titre, corps, id) {
  id = id || titre;
  return `<details class="bloc aide" data-aide="${esc(id)}"${AIDES[id] ? ' open' : ''}><summary>${PICTO_AIDE}<span>${titre}</span></summary><div class="aide-corps">${corps}</div></details>`;
}
function partie(obligatoire, titre, texte) {
  return `<div class="partie ${obligatoire ? 'obligatoire' : 'facultatif'}"><span class="statut ${obligatoire ? 'obligatoire' : 'facultatif'}">${obligatoire ? 'Obligatoire' : 'Facultatif'}</span><h2>${titre}</h2><p>${texte}</p></div>`;
}
function bloc(titre, corps, classe) { return `<section class="bloc${classe ? ' ' + classe : ''}">${titre ? `<h2>${titre}</h2>` : ''}${corps}</section>`; }
function liens(ids) { return `<ul class="sources">${ids.map(i => `<li><a href="${SOURCES[i].u}" target="_blank" rel="noopener">${SOURCES[i].t}</a></li>`).join('')}</ul>`; }
function repere(titre, corps, ids) {
  return `<section class="bloc repere"><h2>${titre}</h2>${corps}${ids ? liens(ids) + `<p class="verif">${VERIFIE() ? `Repères relus le ${VERIFIE()} sur les sources officielles.` : `Repères à vérifier : aucun texte n'a encore été relu pour ce module.`} Le droit change : ouvrez la source avant de la citer.</p>` : ''}</section>`;
}
function tirets(items) { return `<ul class="tirets">${items.map((x, i) => `<li>${x}${/[?!]$/.test(x) ? '' : i === items.length - 1 ? '.' : ' ;'}</li>`).join('')}</ul>`; }
function pas(items) { return `<ol class="pas">${items.map(x => `<li>${x}</li>`).join('')}</ol>`; }

const CONSIGNES = {};
function consigne(id, titre) {
  return `<div class="consigne"><div class="consigne-tete"><b>${titre}</b><button type="button" class="btn" data-copier="${id}">Copier</button></div><pre data-consigne="${id}" tabindex="0"></pre></div>`;
}
const VIDE = '⟦à compléter⟧';
const ou = (cle, defaut) => rempli(cle) ? String(v(cle)).trim() : (defaut || VIDE);

function effets(e) {
  const k = Object.keys(e || {}); if (!k.length) return '';
  return `<div class="effets">${k.map(x => { const bon = (e[x] * JAUGES[x].sens) > 0; return `<span class="effet ${bon ? 'bon' : 'mauvais'}">${JAUGES[x].l} ${e[x] > 0 ? '+' : '−'}${Math.abs(e[x])}</span>`; }).join('')}</div>`;
}
function decision(id) {
  REG.decisions[id] = CH; enreg('d', id, CH, DECISIONS[id].q);
  REG.champs['j_' + id] = { l: 'Justification', ch: CH, requis: true };
  const d = DECISIONS[id], choisi = S.choix[id], o = d.options.find(x => x.id === choisi);
  return `<section class="bloc decision" id="d-${id}">
    <p class="genre">Un choix à faire</p><p class="q">${d.q}</p>
    <div class="options" role="radiogroup" aria-label="${esc(d.q)}">${d.options.map(x => `<label class="option${x.id === choisi ? ' choisi' : ''}"><input type="radio" name="d-${id}" value="${x.id}" data-decision="${id}"${x.id === choisi ? ' checked' : ''}><span>${x.l}</span></label>`).join('')}</div>
    ${o ? `<div class="suite${o.grave ? ' grave' : ''}">${o.suite}</div>${effets(o.e)}
      <div class="champs"><label class="champ large"><span class="l">Expliquez votre choix en trois phrases simples</span><textarea data-champ="j_${id}" rows="4" placeholder="1. Ce que nous avons lu ou constaté : …  2. Pourquoi ce choix convient à notre projet : …  3. Ce que nous ferons concrètement : …">${esc(v('j_' + id))}</textarea><span class="aide">Phrase 1 : ce que vous avez lu ou constaté${d.sources ? ' (dans un des textes ci-dessous)' : ''}. Phrase 2 : pourquoi ce choix convient à votre projet. Phrase 3 : ce que vous ferez concrètement. Vous pouvez changer d'avis : l'état du projet se recalcule.</span></label></div>
      ${d.sources ? liens(d.sources) : ''}` : `<p class="note" style="margin-top:12px">Votre choix modifie l'état du projet, affiché à droite.</p>`}
  </section>`;
}
function scene(id, C) {
  REG.scenes[id] = CH; enreg('s', id, CH, 'Scène : ' + SCENES[id].titre);
  const sc = SCENES[id], va = C.variantes[id];
  if (!va) return `<section class="bloc scene" id="s-${id}"><p class="genre">Une scène</p><h2>${sc.titre}</h2><p class="verrou">Faites d'abord vos choix ci-dessus : la scène en dépend.</p></section>`;
  const rep = S.scenes[id] && S.scenes[id][va.id], r = va.reps.find(x => x.id === rep);
  return `<section class="bloc scene" id="s-${id}"><p class="genre">Une scène, née de vos choix</p><h2>${sc.titre}</h2><p>${va.texte}</p>
    <div class="reps">${va.reps.map(x => `<button type="button" class="rep${x.id === rep ? ' choisi' : ''}" data-scene="${id}" data-variante="${va.id}" data-rep="${x.id}" aria-pressed="${x.id === rep}">${x.l}</button>`).join('')}</div>
    ${r ? `<div class="suite">${r.suite}</div>${effets(r.e)}` : ''}</section>`;
}

/* Ce qui reste d'obligatoire, dans l'ordre du parcours */
function restants(C) {
  const out = [];
  CHAPITRES.forEach(c => {
    REG.seq.filter(x => x.ch === c.id).forEach(x => {
      if (x.t === 'e') {
        if (REG.facultatives[x.id] || horsProjet(x.id)) return;
        const manque = (REG.etapeChamps[x.id] || []).filter(k => !rempli(k)).length;
        if (!S.faits[x.id] || manque) out.push({ ch: c.id, ancre: '#e-' + x.id, titre: x.titre, detail: manque ? texteCompteur(manque) : 'à cocher quand c\'est fait' });
      } else if (x.t === 'd') {
        if (!S.choix[x.id] || !rempli('j_' + x.id)) out.push({ ch: c.id, ancre: '#d-' + x.id, titre: x.titre, detail: !S.choix[x.id] ? 'choix à faire' : 'justification à écrire' });
      } else if (x.t === 's') {
        const va = C.variantes[x.id];
        if (!va || !(S.scenes[x.id] && S.scenes[x.id][va.id])) out.push({ ch: c.id, ancre: '#s-' + x.id, titre: x.titre, detail: va ? 'réponse à choisir' : 'après vos choix' });
      }
    });
    Object.keys(REG.champs).forEach(k => {
      const f = REG.champs[k];
      if (f.ch !== c.id || !f.requis || k.indexOf('j_') === 0 || REG.champsEtape[k] || rempli(k)) return;
      out.push({ ch: c.id, ancre: '[data-champ="' + k + '"]', titre: String(f.l).replace(/<[^>]+>/g, ''), detail: 'champ à remplir' });
    });
  });
  return out;
}

/* Progression */
function progression(ch, C) {
  let total = 0, fait = 0;
  Object.keys(REG.etapes).forEach(id => { if (REG.etapes[id] === ch && !REG.facultatives[id] && !horsProjet(id)) { total++; if (S.faits[id]) fait++; } });
  Object.keys(REG.decisions).forEach(id => { if (REG.decisions[id] === ch) { total++; if (S.choix[id]) fait++; } });
  Object.keys(REG.scenes).forEach(id => { if (REG.scenes[id] === ch) { total++; const va = C.variantes[id]; if (va && S.scenes[id] && S.scenes[id][va.id]) fait++; } });
  return [fait, total];
}

/* Journal de bord IA : lignes numérotées, au moins trois affichées */
const JB_CHAMPS = ['date', 'outil', 'objectif', 'consigne', 'resultat', 'decision', 'pourquoi', 'verif'];
const nJournal = () => Math.max(3, parseInt(v('jb_n', '3'), 10) || 3);
function lignesJournal() {
  const out = [];
  for (let n = 1; n <= Math.max(nJournal(), 40); n++) {
    const l = { n }; JB_CHAMPS.forEach(c => { l[c] = String(v('jb' + n + '_' + c)).trim(); });
    l.rempli = !!(l.objectif || l.consigne || l.resultat || l.pourquoi);
    out.push(l);
  }
  return out.slice(0, Math.max(nJournal(), out.reduce((m, l) => l.rempli ? l.n : m, 0)));
}

const horsProjet = id => Object.keys(PREFIXES).some(k => id.indexOf(PREFIXES[k]) === 0 && v('pj_choix') !== k);

– Guillemets français « » avec une espace à l'intérieur, jamais de guillemets droits. Espace avant : ; ! ? et avant ». Aucune espace avant la virgule et le point.

const LIB_FORMATS = [['prose', 'Prose courte, pas de tableau ni de longue liste'], ['listes', 'Listes courtes, une idée par ligne'], ['tableau', 'Tableau pour comparer, prose sinon'], ['etapes', 'Étapes numérotées, une action par étape']];

function ficheChantier() {
  const C = CHANTIER;
  return `<dl class="fiche"><dt>Opération</dt><dd>${C.resume}</dd><dt>Surface de plancher</dt><dd>${nb(C.surface)} m²</dd><dt>Budget des travaux</dt><dd>${eur(C.budget)} HT</dd>
    <dt>Durée</dt><dd>${C.duree} mois, à partir de l'ordre de service du ${dLong(C.os)} (date fictive)</dd><dt>Maître d'ouvrage</dt><dd>${C.moa}</dd><dt>Maîtrise d'œuvre</dt><dd>${C.moe}</dd><dt>Maquette numérique</dt><dd>${C.bim}</dd></dl>`;
}
function tableauLots() {
  const tot = CHANTIER.lots.reduce((s, l) => s + l[3], 0);
  return tableau(['N°', 'Lot', 'Entreprise (fictive)', 'Montant HT', 'Effectif max.', 'Début', 'Durée'],
    CHANTIER.lots.map(l => [l[0], l[1], l[2], eur(l[3]), l[4], `mois ${l[5]}`, `${l[6]} mois`]).concat([['', '<b>Total</b>', '', `<b>${eur(tot)}</b>`, '', '', '']]));
}
function blocRoles() {
  return `<div class="champs">${ROLES.map(r => champ(r[0], `${r[1]}`, { aide: r[2], sansMention: true, ex: 'Prénom NOM' })).join('')}</div>`;
}
function blocJournalLigne(n) {
  const k = c => 'jb' + n + '_' + c, req = n === 1;

    ${champ(k('pourquoi'), 'Pourquoi', { type: 'zone', lignes: 2, large: true, ex: 'Gardé : …. Rejeté : …', requis: req, sansMention: true })}
    ${champ(k('verif'), 'Vérification (source consultée, date)', { type: 'zone', lignes: 2, large: true, ex: 'Document ouvert, date', requis: req, sansMention: true })}
  </div></section>`;
}
function blocFicheControle() {
  const lignes = THEMES_JURIDIQUES.map((t, i) => {
    const n = i + 1, k = c => 'fc' + n + '_' + c;
    return [t, cel(k('ref'), { l: 'Référence examinée' }), cel(k('src'), { l: 'Source officielle consultée' }), cel(k('date'), { l: 'Date de consultation', court: true }),
      cel(k('verdict'), { l: 'Verdict', liste: [['exacte', 'Exacte'], ['inexacte', 'Inexacte'], ['introuvable', 'Introuvable'], ['perimee', 'Périmée']] })];
  });
  return tableau(['Thème', 'Référence examinée', 'Source officielle consultée', 'Date', 'Verdict'], lignes);
}
const cel = (cle, o) => { o = o || {}; REG.champs[cle] = { l: o.l || cle, ch: CH, requis: !!o.requis };
  if (o.liste) return `<select data-champ="${cle}" aria-label="${esc(o.l || '')}">${[['', '…']].concat(o.liste).map(x => `<option value="${x[0]}"${v(cle) === x[0] ? ' selected' : ''}>${x[1]}</option>`).join('')}</select>`;
  if (o.court) return `<input type="text" data-champ="${cle}" value="${esc(v(cle))}" aria-label="${esc(o.l || '')}" autocomplete="off">`;
  return `<textarea data-champ="${cle}" rows="2" aria-label="${esc(o.l || '')}">${esc(v(cle))}</textarea>`; };

}

/* 1. Stratégie : grille pondérée */
const CRITERES_STRAT = ['Coût de mise en place', 'Délai de mise en place', 'Risque technique et juridique', 'Gain attendu sur le chantier (délais, qualité, sécurité)', 'Compétences à acquérir'];
const EXEMPLES_SCENARIOS = [`Maquette en conception seulement : la maquette sert aux plans, le chantier reste sur papier`, `Maquette partagée jusqu'au chantier : convention BIM, tablettes sur site, réunions sur la maquette`, `Chantier connecté : maquette partagée, capteurs sur les engins et le béton, IA qui alerte sur les écarts`];
function calcStrat() {
  const w = [1, 2, 3, 4, 5].map(i => num('ps_w' + i));
  const noms = [1, 2, 3].map(o => (String(v('ps_opt' + o)).split(/[:(]/)[0].trim().slice(0, 40)) || ('Scénario ' + o));
  const sc = [1, 2, 3].map(o => [1, 2, 3, 4, 5].map(i => num('ps_s' + i + '_' + o)));
  const ok = w.every(x => !isNaN(x) && x >= 0) && sc.every(l => l.every(x => !isNaN(x) && x >= 0 && x <= 10)) && w.reduce((s, x) => s + x, 0) > 0;
  if (!ok) return { ok: false, noms };
  const tot = ww => sc.map(l => l.reduce((s, x, i) => s + x * ww[i], 0) / ww.reduce((s, x) => s + x, 0));
  const t = tot(w), mieux = t.indexOf(Math.max.apply(null, t));
  const sens = [0, 1, 2, 3, 4].map(i => { const ww = w.slice(); ww[i] = ww[i] * 2; const tt = tot(ww); return { crit: CRITERES_STRAT[i], mieux: tt.indexOf(Math.max.apply(null, tt)) }; });
  return { ok: true, noms, t, mieux, sens, ecartPremiers: t.slice().sort((a, b) => b - a) };
}
function sortieStrat() {
  const r = calcStrat();
  if (!r.ok) return `<p class="note">Remplissez les cinq poids (au moins un non nul) et les quinze notes (de 0 à 10) : le calcul s'affiche ici.</p>`;
  const bascule = r.sens.filter(s => s.mieux !== r.mieux);
  return tableau(['Option', 'Note pondérée sur 10'], r.noms.map((n, i) => [esc(n), (i === r.mieux ? '<b>' : '') + nb(r.t[i], 2) + (i === r.mieux ? ' · en tête</b>' : '')]))
    + `<p>${r.ecartPremiers[0] - r.ecartPremiers[1] < 0.5 ? `Les deux premières options sont à moins d'un demi-point : la recommandation est fragile.` : `L'option en tête a plus d'un demi-point d'avance.`}</p>`
    + `<p>${bascule.length ? `Test de sensibilité : en doublant le poids de « ${bascule.map(b => b.crit).join(' », « ')} », une autre option passe en tête. Dites pourquoi vos poids sont justifiés.` : `Test de sensibilité : doubler le poids d'un seul critère ne change pas l'option en tête.`}</p>`;
}
function blocStrategie() {
  const R = estP('strategie'), r = calcStrat();

  const lignes = CRITERES_STRAT.map((c, i) => { const n = i + 1;
    return [c, cel('ps_w' + n, { l: 'Poids ' + c, court: true, requis: R })].concat([1, 2, 3].map(o => cel('ps_s' + n + '_' + o, { l: `Note ${c}, ${r.noms[o - 1]}`, court: true, requis: R && o < 3 }))); });
  return bloc(`Ce que vous allez faire ici`, `<p>Un <b>scénario</b> est une façon de numériser le chantier. Vous en décrivez deux ou trois. Puis vous les comparez avec cinq critères, comme on compare trois devis. La page calcule une note par scénario. Vous expliquez ensuite lequel vous recommandez, et pourquoi.</p>
      <p>Trois scénarios possibles, à reprendre ou à remplacer :</p>` + tirets(EXEMPLES_SCENARIOS.map(x => x.replace(/^./, c => c.toLowerCase()))) + `<p class="note">Vous pouvez copier ces exemples dans les champs ci-dessous, puis les adapter. Le troisième scénario est facultatif.</p>`)
    + etape('ps_cadre', `Décrivez vos scénarios`, '30 min', `<p>Un scénario tient en une phrase : ce que l'on met en place, et jusqu'où. Donnez-lui un nom court, il servira de titre de colonne dans la grille.</p>
      <div class="champs">${champ('ps_opt1', `Scénario 1 (nom court et description)`, { requis: R, sansMention: true, large: true, ex: EXEMPLES_SCENARIOS[0] })}${champ('ps_opt2', `Scénario 2`, { requis: R, sansMention: true, large: true, ex: EXEMPLES_SCENARIOS[1] })}${champ('ps_opt3', `Scénario 3 (facultatif)`, { sansMention: true, large: true, ex: EXEMPLES_SCENARIOS[2] })}
      ${champ('ps_hyp', `Vos hypothèses chiffrées, avec leurs sources`, { type: 'zone', lignes: 5, large: true, requis: R, sansMention: true, ex: `Scénario 2 : licence et formation environ … € (source : …, consultée le …). Scénario 3 : capteurs … € (hypothèse du groupe).`, aide: `Un ordre de grandeur par scénario, au moins pour le coût et le délai. Chaque chiffre cite une source ouverte et sa date. Sans source, écrivez « hypothèse du groupe » : c'est permis, à condition de le dire.` })}</div>` + consigne('travail_strategie', `Consigne pour critiquer vos scénarios et vos critères`))
    + etape('ps_grille', `Notez et pondérez`, '45 min', `<p><b>Le poids</b> dit l'importance du critère pour Rive Nord : 10 pour ce qui compte le plus, 0 pour ce qui ne compte pas. <b>La note</b> dit si le scénario est bon sur ce critère : 10 pour excellent, 0 pour mauvais. Attention : pour le coût, le délai et le risque, un scénario peu coûteux, rapide ou peu risqué reçoit une note élevée.</p>
      <p>Les colonnes portent les noms de vos scénarios. La page calcule la note pondérée : somme des notes multipliées par les poids, divisée par la somme des poids.</p>`
      + tableau(entetes, lignes) + `<div data-calc="strat"></div>`
      + `<div class="champs">${champ('ps_verif', `Calcul refait à la main, pour un scénario`, { type: 'zone', large: true, requis: R, sansMention: true, ex: `Scénario 1 : (7×3 + 5×2 + …) / (3 + 2 + …) = …`, aide: `Écrivez le calcul complet d'un scénario. Si vous ne trouvez pas le même résultat que la page, cherchez l'erreur : c'est ce que le jury demandera.` })}</div>`)
    + etape('ps_reco', `Recommandez`, '30 min', `<p>Votre recommandation sera la <b>page la plus lue de votre dossier</b> et la diapositive principale de l'oral. Elle tient en cinq à dix lignes, dans cet ordre : le scénario retenu ; les deux chiffres de la grille qui le justifient ; ce que ce scénario coûte ou impose ; ce qu'il faut vérifier avant de décider.</p>

      ${forcesFaiblesses('ps_ff', R)}
      ${champ('ps_limites', `Ce qui ferait changer d'avis`, { type: 'zone', large: true, requis: R, sansMention: true, ex: `Si le coût réel dépassait … ou si l'équipe n'était pas formée avant …`, aide: `Le test de sensibilité de la grille vous aide : quel critère, s'il pesait plus lourd, changerait le classement ?` })}
      ${transverse('ps_trans', `performance financière, gestion contractuelle, pilotage, management RH.`, R)}</div>`);

/* 2. Suivi de chantier : valeur acquise simplifiée */
function lignesSuivi() {
  const m = num('pc_mois');
  return CHANTIER.lots.map(l => {
    const av = num('pc_av' + l[0]) / 100, dep = num('pc_dep' + l[0]);
    const prevu = isNaN(m) ? NaN : bornes((m - l[5]) / l[6], 0, 1);
    const pv = prevu * l[3], ev = av * l[3];
    return { n: l[0], lot: l[1], budget: l[3], av, dep, prevu, pv, ev, spi: pv > 0 ? ev / pv : NaN, cpi: dep > 0 ? ev / dep : NaN, ok: !isNaN(av) && !isNaN(dep) && !isNaN(prevu) };
  });
}
function sortieSuivi() {
  const L = lignesSuivi().filter(x => x.ok);
  if (isNaN(num('pc_mois'))) return `<p class="note">Indiquez d'abord le mois de suivi (de 1 à ${CHANTIER.duree}).</p>`;
  if (!L.length) return `<p class="note">Renseignez l'avancement réel (en %) et le montant dépensé (en €) d'au moins un lot.</p>`;
  const tot = L.reduce((s, x) => ({ pv: s.pv + x.pv, ev: s.ev + x.ev, ac: s.ac + x.dep }), { pv: 0, ev: 0, ac: 0 });
  const stat = x => (x.spi < 0.9 || x.cpi < 0.9) ? (x.spi < 0.9 && x.cpi < 0.9 ? 'retard et dépassement' : x.spi < 0.9 ? 'en retard' : 'coût dépassé') : 'dans la cible';
  return tableau(['Lot', 'Prévu (linéaire)', 'Réel', 'Valeur prévue', 'Valeur acquise', 'Dépensé', 'Délai (SPI)', 'Coût (CPI)', 'Lecture'],
      L.map(x => [`${x.n}. ${x.lot}`, pct(x.prevu), pct(x.av), eur(x.pv), eur(x.ev), eur(x.dep), nb(x.spi, 2), nb(x.cpi, 2), stat(x)])
        .concat([['<b>Ensemble des lots saisis</b>', '', '', `<b>${eur(tot.pv)}</b>`, `<b>${eur(tot.ev)}</b>`, `<b>${eur(tot.ac)}</b>`, `<b>${nb(tot.ev / tot.pv, 2)}</b>`, `<b>${nb(tot.ev / tot.ac, 2)}</b>`, '']]))
    + `<p class="note">Lecture : un indice inférieur à 0,9 signale un écart. Délai (SPI) = valeur acquise divisée par valeur prévue. Coût (CPI) = valeur acquise divisée par dépensé. L'avancement prévu est supposé linéaire sur la durée du lot : c'est une hypothèse simplificatrice, à discuter.</p>`;
}
function blocChantier() {
  const R = estP('chantier');
  const lignes = CHANTIER.lots.map(l => [`${l[0]}. ${l[1]}`, eur(l[3]), `mois ${l[5]} à ${l[5] + l[6]}`, cel('pc_av' + l[0], { l: `Avancement réel lot ${l[0]}`, court: true }), cel('pc_dep' + l[0], { l: `Dépensé lot ${l[0]}`, court: true })]);
  return bloc(`Ce que vous allez faire ici`, `<p>Un chantier numérisé produit des données chaque jour : avancement pointé sur la maquette, heures des équipes, livraisons, mesures des capteurs. Vous construisez le tableau de bord qu'un manager de projets lirait avec ces données : pour chaque lot, où en est-on par rapport au prévu, et combien a-t-on dépensé.</p>
      <p>Le chantier Rive Nord est fictif : il n'a pas de relevé réel. Vous <b>inventez un point d'avancement plausible</b>, à un mois donné, pour au moins quatre lots. La page calcule les écarts. Vous dites ensuite d'où ces données viendraient dans un vrai chantier numérisé, et ce que cela change par rapport au suivi sur papier.</p>`)
    + etape('pc_donnees', `Inventez les données de suivi`, '30 min', `<p>Choisissez un mois entre 1 et ${CHANTIER.duree}. Pour chaque lot en cours à ce mois, décidez un avancement réel et un montant dépensé. Faites des choix variés : un lot en avance, un lot en retard, un lot qui dépasse son budget. Écrivez vos règles d'invention : elles font partie de l'exercice et le jury les lira.</p>
      <div class="champs">${champ('pc_mois', `Mois de suivi (1 à ${CHANTIER.duree})`, { requis: R, sansMention: true, ex: '9' })}${champ('pc_regles', `Comment avons-nous inventé ces données ?`, { type: 'zone', large: true, requis: R, sansMention: true, ex: `Lot 2 : retard de deux mois à cause du manque de grutiers, dépenses au rythme prévu. Lot 1 : terminé, dépassement de 13 % à cause du réseau enterré.` })}
      ${champ('pc_sources', `D'où viendraient ces données dans un chantier numérisé ?`, { type: 'zone', large: true, requis: R, sansMention: true, ex: `Avancement : pointage sur la maquette par le chef de chantier chaque vendredi. Dépenses : factures validées dans le logiciel de gestion. Heures : badgeuse de chantier.`, aide: `Une source par type de donnée. C'est le cœur du lien avec la transition numérique.` })}</div>` + consigne('travail_chantier', `Consigne pour construire des données plausibles`))
    + etape('pc_suivi', `Tableau de bord des écarts`, '45 min', `<p>Saisissez l'avancement réel en pourcentage (0 à 100) et le montant déjà dépensé en euros, lot par lot.</p>`
      + tableau(['Lot', 'Budget', 'Période prévue', 'Avancement réel (%)', 'Dépensé (€)'], lignes) + `<div data-calc="chantier"></div>
      <div class="champs">${champ('pc_verif', `Calcul refait à la main sur un lot`, { type: 'zone', large: true, requis: R, sansMention: true })}</div>`)
    + etape('pc_actions', `Actions correctives et apport du numérique`, '40 min', `<p>Reprenez un aléa du chantier et traitez-le : quelles actions, qui les porte, sous quel délai. Puis dites ce que le tableau de bord numérique change par rapport au suivi sur papier.</p><div class="champs">
      ${champ('pc_alea', `Aléa traité`, { type: 'liste', options: CHANTIER.aleas.map((a, i) => [String(i + 1), a]), requis: R, sansMention: true })}

      ${champ('pc_actions', `Actions correctives, responsables, délais`, { type: 'zone', lignes: 4, large: true, requis: R, sansMention: true, ex: `Action 1 : … Responsable : … Délai : …` })}
      ${champ('pc_numerique', `Ce que le numérique change par rapport au suivi sur papier`, { type: 'zone', lignes: 3, large: true, requis: R, sansMention: true, ex: `Écart connu le vendredi au lieu de la fin du mois. Mais : il faut que le chef de chantier pointe vraiment, et que les factures soient saisies à temps.` })}
      ${forcesFaiblesses('pc_ff', R)}
      ${transverse('pc_trans', `stratégie, gestion contractuelle, management RH.`, R)}</div>`);
}

/* 3. Veille contractuelle : fiches */
const CAS_VEILLE = [
  `Convention BIM : une erreur dans la maquette partagée fait percer un mur porteur au mauvais endroit. Qui est responsable ?`,
  `Propriété de la maquette : après la réception, le maître d'ouvrage veut réutiliser la maquette pour l'exploitation. Qui la possède, qui peut la modifier ?`,
  `Mise à jour de la maquette : le bureau d'études change le plan de réservations des fluides. Qui paie les reprises sur le chantier ?`,
  `Chantier connecté : badges, caméras et capteurs sur les engins. Quelles données personnelles, quelles obligations envers les salariés ?`,
  `Pièces contractuelles rédigées avec une IA générative : un avenant est écrit par Claude. Qui vérifie, qui engage l'entreprise ?`,
  `Cybersécurité : la plateforme qui héberge la maquette est attaquée et le chantier s'arrête deux jours. Quelles obligations, quels recours ?`
];

    return `<section class="bloc ligne-journal"><h3>Fiche de veille ${n}</h3><div class="champs">

      ${champ(k('ref'), `Référence examinée`, { requis: req, sansMention: true })}${champ(k('src'), `Source officielle consultée`, { requis: req, sansMention: true })}
      ${champ(k('date'), `Date de consultation`, { requis: req, sansMention: true })}${champ(k('statut'), `Statut`, { type: 'liste', options: [['verifie', 'Vérifié sur la source officielle'], ['averifier', 'À vérifier']], requis: req, sansMention: true })}
      ${champ(k('action'), `Ce que fait le manager de projets`, { type: 'zone', lignes: 2, large: true, requis: req, sansMention: true })}</div></section>`; }).join('');
  return bloc(`Ce que vous allez faire ici`, `<p>Le numérique ajoute des risques juridiques au chantier : qui est responsable d'une erreur dans la maquette, à qui appartient la maquette, que deviennent les données des salariés d'un chantier connecté, qui engage l'entreprise quand une IA rédige un document. Vous traitez ces cas un par un, comme un manager de projets qui prépare une réunion avec son juriste.</p>
      <p>Pour chaque cas, vous cherchez la <b>référence officielle</b> qui s'applique : un texte sur Légifrance, une fiche de la CNIL, un règlement sur EUR-Lex. Claude vous donne des pistes, parfois fausses. Vous ouvrez la source, vous notez la date, et vous écrivez ce que fait le manager.</p>`)
    + etape('pk_cadre', `Décrivez le cadre contractuel`, '30 min', `<p>Le chantier fictif n'a pas de contrat réel. Décrivez en quelques lignes les documents que vous supposez : un marché privé de travaux par lot, un cahier des charges, une convention BIM. Puis dites ce que vous savez du cadre qui s'applique, et ce qu'il faudra vérifier.</p>
      <div class="champs">${champ('pk_docs', `Documents contractuels supposés`, { type: 'zone', large: true, requis: R, sansMention: true })}
      ${champ('pk_cadre', `Cadre applicable (marché privé ou public, norme, cahier des clauses) : ce que vous savez, ce qu'il faut vérifier`, { type: 'zone', large: true, requis: R, sansMention: true })}</div>` + consigne('travail_contrats', `Consigne pour lister les clauses sensibles`))
    + etape('pk_fiches', `Fiches de veille`, '60 min', `<p>Une fiche par cas. Au moins deux fiches complètes. Une fiche « vérifié » indique la source officielle ouverte et sa date. Sinon, elle reste « à vérifier ».</p>` + fiches)
    + etape('pk_reco', `Synthèse`, '20 min', `<p>Trois points de vigilance : ce qu'un manager de projets doit faire avant de numériser le chantier, en une phrase chacun. Ils iront dans le dossier et sur la diapositive principale.</p><div class="champs">${champ('pk_synthese', `Les trois points de vigilance du manager de projets`, { type: 'zone', lignes: 4, large: true, requis: R, sansMention: true, ex: `1. Signer la convention BIM avant … 2. Informer les salariés de … 3. Faire relire par … tout document rédigé avec une IA.` })}

/* 4. Planning des équipes */
function effectifsMois() {
  return Array.from({ length: CHANTIER.duree }, (_, i) => { const m = i + 1; let tot = 0; const actifs = [];
    CHANTIER.lots.forEach(l => { if (m > l[5] && m <= l[5] + l[6]) { tot += l[4]; actifs.push(l[0]); } });
    return { m, tot, actifs }; });
}
function sortiePlanning() {
  const E = effectifsMois(), pic = E.reduce((a, b) => b.tot > a.tot ? b : a), dispo = num('pr_dispo'), max = pic.tot;
  const barres = E.map(e => `<div class="mois"><span class="m">${dateMois(e.m - 1).replace(' 20', ' ’')}</span><span class="b"><i style="width:${Math.round(e.tot / max * 100)}%"${!isNaN(dispo) && e.tot > dispo ? ' class="sur"' : ''}></i></span><span class="n">${e.tot}</span></div>`).join('');
  const moy = E.reduce((s, e) => s + e.tot, 0) / E.length;
  const sur = isNaN(dispo) ? [] : E.filter(e => e.tot > dispo);
  return `<div class="mois-liste">${barres}</div><p>Pointe : <b>${pic.tot} personnes</b> au mois ${pic.m} (${dateMois(pic.m - 1)}), lots ${pic.actifs.join(', ')}. Moyenne : ${nb(moy, 1)} personnes. Hypothèse : chaque lot emploie son effectif maximal pendant toute sa durée, ce qui surestime la charge.</p>`
    + (isNaN(dispo) ? '' : `<p>${sur.length ? `Avec ${dispo} personnes disponibles, ${sur.length} mois dépassent la capacité (du mois ${sur[0].m} au mois ${sur[sur.length - 1].m}).` : `Avec ${dispo} personnes disponibles, aucun mois ne dépasse la capacité.`}</p>`);
}
function blocRh() {
  const R = estP('rh');
  const comp = [1, 2, 3, 4].map(n => [cel('rc' + n + '_nom', { l: 'Compétence', court: true }), cel('rc' + n + '_lots', { l: 'Lots ou métiers concernés', court: true }), cel('rc' + n + '_besoin', { l: 'Besoin et moment', court: true }), cel('rc' + n + '_mesure', { l: 'Mesure : recruter, former, sous-traiter' })]);
  return bloc(`Ce que vous allez faire ici`, `<p>Numériser un chantier change les métiers : le conducteur de travaux lit la maquette sur une tablette, un coordinateur BIM fait vivre la maquette, quelqu'un répond des données. Vous lisez d'abord la charge des équipes sur les ${CHANTIER.duree} mois, pour voir quand le chantier est le plus tendu. Puis vous dites quelles <b>compétences numériques</b> manquent, pour quels métiers, et comment les obtenir : recruter, former ou sous-traiter, avec un coût et un délai.</p>
      <p class="note">Aucune donnée sur de vraies personnes : vous raisonnez par métier et par compétence.</p>`)
    + etape('pr_planning', `Lisez la charge d'ensemble`, '30 min', `<p>La page additionne les effectifs maximaux des onze lots, mois par mois. Indiquez combien de personnes votre entreprise peut mobiliser en même temps : la page signale les mois en dépassement. Ces pointes sont les moments où former quelqu'un est le plus difficile.</p>
      <div class="champs">${champ('pr_dispo', `Personnes mobilisables en même temps`, { requis: R, sansMention: true, ex: '120' })}</div><div data-calc="rh"></div>` + consigne('travail_rh', `Consigne pour critiquer le planning`)
      + `<div class="champs">${champ('pr_lecture', `Notre lecture : pointes, creux, lots qui se chevauchent`, { type: 'zone', large: true, requis: R, sansMention: true })}
      ${champ('pr_verif', `Calcul refait à la main (un mois)`, { type: 'zone', large: true, requis: R, sansMention: true })}</div>`)

      + tableau(['Compétence', 'Lots ou métiers concernés', 'Besoin et moment', 'Mesure'], comp)
      + `<div class="champs">${champ('pr_mesures', `Trois mesures de gestion des ressources humaines, avec leur coût et leur délai`, { type: 'zone', lignes: 4, large: true, requis: R, sansMention: true, ex: `1. Former les quatre chefs de chantier à la lecture de la maquette : 2 jours chacun, environ … € (source : …), avant le mois 3. 2. … 3. …`, aide: `Un coût et un délai par mesure. Sans source, écrivez « hypothèse du groupe ».` })}
      ${champ('pr_metiers', `Ce qui change dans les métiers du chantier`, { type: 'zone', lignes: 3, large: true, requis: R, sansMention: true, ex: `Le conducteur de travaux passe … heures par semaine sur la maquette au lieu de … Le chef de chantier pointe l'avancement sur tablette. Un nouveau rôle apparaît : …` })}
      ${forcesFaiblesses('pr_ff', R)}
      ${transverse('pr_trans', `stratégie, performance financière, gestion contractuelle.`, R)}</div>`);
}

function projetTravail() {
  const blocs = { strategie: blocStrategie(), chantier: blocChantier(), contrats: blocContrats(), rh: blocRh() };
  const P = projetChoisi();
  if (!P) return bloc(`Choisissez d'abord un projet`, `<p class="verrou">Cette étape s'ouvre quand le groupe a choisi son projet, à l'étape précédente.</p>`);

/* Résumés pour le support et le dossier */

  if (p === 'contrats') { const f = [1, 2, 3, 4].filter(n => rempli('ck' + n + '_cas')); const ver = f.filter(n => v('ck' + n + '_statut') === 'verifie').length; return `${f.length} fiches de veille, ${ver} vérifiées sur source officielle.`; }
  if (p === 'rh') { const E = effectifsMois(), pic = E.reduce((a, b) => b.tot > a.tot ? b : a); return `Pointe de ${pic.tot} personnes au mois ${pic.m}.`; }

    [`Titre`, `${P ? P.t : VIDE}. Groupe ${rempli('id_groupe') ? v('id_groupe') : VIDE}, classe ${nomClasse()}${dateChamp('id_seance2') ? ', ' + S2L() : ''}. Membres : ${ou('id_membres').replace(/\n+/g, ', ')}.`],
    [`Le chantier et la mission`, `Rive Nord (fictif) : ${nb(CHANTIER.surface)} m², ${eur(CHANTIER.budget)} HT, ${CHANTIER.duree} mois. Missions couvertes : ${P ? P.missions.join(', ') : VIDE}.`],
    [`Le problème et notre cadrage`, n('cad_comprehension')],

    [`L'usage de l'IA`, `${lj.length} usage${lj.length > 1 ? 's' : ''} tracé${lj.length > 1 ? 's' : ''} dans le journal, dont ${rej} gardé${rej > 1 ? 's' : ''} après modification ou rejeté${rej > 1 ? 's' : ''}. Source : journal de bord, ${dateFr(new Date())}.`],
    [`Les références juridiques`, `${ver} thème${ver > 1 ? 's' : ''} sur ${THEMES_JURIDIQUES.length} avec verdict (fiche de contrôle). Citez la source officielle et la date de consultation pour chaque référence.`],
    [`Limites, contraintes, forces et faiblesses`, n(P ? ({ strategie: 'ps_ff', chantier: 'pc_ff', contrats: 'pk_ff', rh: 'pr_ff' })[P.id] : 'bi_pasconfie') + ` Non confié à l'IA : ` + n('bi_pasconfie')],
    [`La suite et les questions`, n('bi_gagne')]

Object.assign(CONSIGNES, {
  plan_support: () => [planSupport().map((s, i) => `Diapositive ${i + 1} – ${s[0]}\n${s[1]}`).join('\n\n')],
  travail_strategie: () => [`Nous comparons des scénarios de transition numérique pour le chantier fictif Rive Nord : ${ou('ps_opt1')} ; ${ou('ps_opt2')}${rempli('ps_opt3') ? ' ; ' + v('ps_opt3') : ''}.
Critères actuels : ${CRITERES_STRAT.join(' ; ')}.

Critique ces scénarios et ces critères : lesquels manquent, lesquels se recoupent, lesquels sont mesurables ? Pour chaque ordre de grandeur de coût ou de délai que tu avances, dis d'où il vient, ton niveau de certitude, et où nous pourrions le vérifier. Ne choisis pas à notre place.`],
  travail_chantier: () => [`Nous inventons un point d'avancement pour le chantier fictif Rive Nord au mois ${ou('pc_mois')}. Propose-nous des règles pour produire des avancements et des dépenses plausibles pour quatre lots au moins, avec des écarts crédibles (un lot en retard, un lot qui dépasse son budget). Explique chaque règle. Nous saisirons les chiffres nous-mêmes.`],
  travail_contrats: () => [`Nous faisons la veille juridique de la transition numérique du chantier fictif Rive Nord. Voici les cas à étudier :
${CAS_VEILLE.map((c, i) => (i + 1) + '. ' + c).join('\n')}

Pour chaque cas, dis quel type de clause ou de texte s'applique et ce qu'un manager de projets doit demander à la maîtrise d'œuvre, à l'entreprise ou au juriste. Pour toute référence juridique, donne le nom exact du texte, marque ton niveau de certitude et écris « à vérifier » quand tu n'es pas sûr. Nous ouvrirons chaque source officielle.`],
  travail_rh: () => [`Voici le planning de charge du chantier fictif Rive Nord, calculé en additionnant les effectifs maximaux des onze lots. Il surestime la charge, car chaque lot n'emploie pas son maximum pendant toute sa durée.

Pointes et creux : ${effectifsMois().map(e => `mois ${e.m} : ${e.tot}`).join(' ; ')}.

Critique cette hypothèse. Propose trois façons de lisser la charge, puis trois compétences numériques (maquette, données, outils de chantier) que l'entreprise devra acquérir, avec pour chacune un moyen : recruter, former ou sous-traiter. Dis ce que tu supposes. N'invente aucune donnée sur de vraies personnes.`]
});

/* ───────── Diagnostic, manques, dossier ───────── */
function diagnostic(C) {
  const j = C.j, d = C.drap, faibles = [];
  if (j.risque >= 65) faibles.push('le risque juridique');
  if (j.charge >= 65) faibles.push('la charge de travail');
  if (j.fiabilite <= 35) faibles.push('la fiabilité des sources');
  if (j.tracabilite <= 35) faibles.push('la traçabilité de l\'IA');
  const nbChoix = Object.keys(DECISIONS).filter(k => S.choix[k]).length;
  let titre;
  if (nbChoix < 3) titre = `Diagnostic provisoire : faites d'abord vos choix`;
  else if (!faibles.length) titre = `Projet maîtrisé`;
  else if (faibles.length === 1) titre = `Projet solide, avec un point faible : ${faibles[0]}`;
  else titre = `Projet à reprendre sur ${faibles.length} points`;
  const ph = [];
  ph.push(j.risque <= 30 ? `Risque juridique : le projet reste dans un cadre que vous savez expliquer.` : j.risque < 65 ? `Risque juridique : des points restent à sécuriser avant le dépôt.` : `Risque juridique : le dossier expose le groupe. Reprenez les données et les références.`);
  ph.push(j.charge <= 50 ? `Charge de travail : le périmètre tient dans le temps disponible.` : j.charge < 65 ? `Charge de travail : le périmètre est tendu. Chaque ajout se paie.` : `Charge de travail : le périmètre dépasse le temps disponible.`);
  ph.push(j.fiabilite >= 70 ? `Fiabilité : les références ont été ouvertes et les chiffres refaits à la main.` : j.fiabilite > 35 ? `Fiabilité : elle tient, mais des références restent à ouvrir.` : `Fiabilité : trop de références reposent sur la seule parole de l'outil.`);
  ph.push(j.tracabilite >= 70 ? `Traçabilité : le journal montre ce que l'IA a apporté, et ce que vous avez rejeté.` : j.tracabilite > 35 ? `Traçabilité : le journal existe, il manque des lignes ou des rejets.` : `Traçabilité : le journal est trop pauvre pour être crédible.`);
  if (nbChoix < 3) { ph.length = 0; ph.push(`Vous n'avez pas encore fait assez de choix pour un diagnostic. Avancez dans les étapes 1 à 4, puis revenez ici.`); }
  const lignes = lignesJournal().filter(l => l.rempli).length;
  const verdicts = THEMES_JURIDIQUES.filter((t, i) => v('fc' + (i + 1) + '_verdict')).length;
  const pool = [
    [0, d.donneesReelles, `Retirer les données réelles de vos conversations et repartir sur le chantier fictif.`],
    [0, d.cadrageIA, `Réécrire le cadrage initial à la main et le dater.`],
    [0, d.sansVerif, `Ouvrir chaque référence sur sa source officielle et noter le verdict.`],
    [0, lignes < 3, `Remplir le journal : au moins trois usages significatifs, dont un rejeté ou modifié.`],
    [0, true, `Enregistrer le fichier de projet et le ranger dans le dossier Teams du groupe.`],
    [1, verdicts < 3, `Terminer la fiche de contrôle : un verdict pour chaque thème traité.`],
    [1, j.charge >= 60, `Réduire le périmètre au livrable minimal et le terminer.`],
    [1, true, `Refaire à la main un calcul de chaque tableau ou indicateur du projet.`],
    [1, true, `Préparer le support : dix diapositives au plus, avec sources et dates.`],
    [2, true, `Relire le journal et la fiche de contrôle avec une personne extérieure au groupe.`],
    [2, true, `Préparer l'oral : qui présente quoi, et la réponse à la question du jury.`],
    [2, true, `Déposer les fichiers sur Teams au plus tard ${DEPOT()}.`]
  ];
  const temps = [`Cette semaine`, `Avant le dépôt`, `Avant l'oral`].map((t, i) => ({ t, a: pool.filter(x => x[0] === i && x[1]).slice(0, 3).map(x => x[2].replace(/\.$/, '')) }));
  return { titre, phrases: ph, alertes: alertes(C).filter(a => a[0] !== 'info').map(a => a[1]), temps };
}

function manques(C) {

  const prec = CHAPITRES[i - 1], suiv = CHAPITRES[i + 1];
  $('page').innerHTML = `<header class="tete"><p class="seance">${typeof ch.seance === 'function' ? ch.seance() : ch.seance}</p><h1>${ch.titre}</h1><p class="chapo">${ch.chapo}</p></header><div id="prochaine" class="prochaine"></div>${ch.rendu(C)}
    <div class="pied">${prec ? `<a class="btn" href="#${prec.id}">Étape précédente</a>` : '<span></span>'}${suiv ? `<a class="btn plein" href="#${suiv.id}">Étape suivante</a>` : ''}</div>`;
  typoNoeuds($('page'));
  document.title = typo(ch.nav.replace(/^\d\. /, '') + ' – TNBIM, ESCT Nantes');
  majLeger();
  if (haut) { window.scrollTo(0, 0); } else window.scrollTo(0, y);
}
function allerA(id, depuisHash) {
  const cible = chapitre(id).id;
  S.chapitre = cible; sauver();
  fermerVolets();
  rendre(true);
  if (!depuisHash && location.hash !== '#' + cible) history.replaceState(null, '', '#' + cible);
}

/* Messages brefs, dialogue, volets */
let minuteurBref = null;
function bref(t) { const z = $('bref'); z.textContent = typo(t); z.hidden = false; clearTimeout(minuteurBref); minuteurBref = setTimeout(() => { z.hidden = true; }, Math.max(2600, t.length * 60)); }
function demander(titre, texte, oui, non) {
  return new Promise(res => {
    const d = $('dlg'); $('dlg-t').textContent = typo(titre); $('dlg-p').textContent = typo(texte); $('dlg-oui').textContent = oui || 'Continuer'; $('dlg-non').textContent = typo(non || 'Annuler');
    if (!d.showModal) { res(window.confirm(titre + '\n\n' + texte)); return; }
    d.returnValue = 'non';
    d.onclose = () => res(d.returnValue === 'oui');
    d.showModal();
  });
}
function fermerVolets() {
  $('nav').classList.remove('ouvert'); $('etat').classList.remove('ouvert');
  document.querySelectorAll('[data-action^="volet-"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
function basculer(id) {
  const autre = id === 'nav' ? 'etat' : 'nav';
  $(autre).classList.remove('ouvert');
  const ouvert = $(id).classList.toggle('ouvert');
  document.querySelectorAll('[data-action="volet-' + id + '"]').forEach(b => b.setAttribute('aria-expanded', String(ouvert)));
}

/* Fichiers */
function telecharger(nom, contenu, type) {
  const b = new Blob([contenu], { type: type }), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = nom; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
const slug = x => String(x).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
const nomGroupe = () => (rempli('id_groupe') ? 'G' + String(v('id_groupe')).trim().replace(/^g/i, '') : 'groupe');
const cheminNom = () => nomGroupe() + (rempli('id_nom') ? '_' + slug(v('id_nom')) : '');
function copier(texte, message) {
  const fin = () => bref(message || 'Copié.');
  const secours = () => { const z = document.createElement('textarea'); z.value = texte; z.style.position = 'fixed'; z.style.opacity = '0'; document.body.appendChild(z); z.select(); try { document.execCommand('copy'); fin(); } catch (e) { bref('Copie impossible : sélectionne le texte à la main.'); } z.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texte).then(fin, secours); else secours();
}
const nomJson = () => 'TNBIM_' + cheminNom() + '_' + (S.exportLe || new Date().toISOString()).slice(0, 10) + '.json';
function enregistrer() {
  S.exportLe = new Date().toISOString(); S.modifsExport = S.modifs;
  telecharger(nomJson(), JSON.stringify(S, null, 1), 'application/json');
  sauver(); $('rappel').hidden = true; majBarre(); bref('Fichier enregistré dans les téléchargements. Rangez-le aussi dans le dossier Teams du groupe.');
}
function preparerImpression() {
  const C = calcul(); $('impression').innerHTML = dossierHtml(C); typoNoeuds($('impression'));
  /* Pied de page du PDF : nom de l'étudiant et numéro de page (navigateurs qui gèrent les marges de page) */
  let st = $('style-impression');
  if (!st) { st = document.createElement('style'); st.id = 'style-impression'; document.head.appendChild(st); }
  const nom = ('Groupe ' + (rempli('id_groupe') ? String(v('id_groupe')).trim() : '…') + (rempli('id_nom') ? ' \u2013 ' + String(v('id_nom')).trim() : '')).replace(/[\\"\n\r]/g, ' ');
  const police = 'font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:8.5pt;color:#64748B;';
  st.textContent = '@page{@bottom-left{content:"' + nom + ' \u2013 mini-dossier IA et vente";' + police + '}@bottom-right{content:counter(page) " / " counter(pages);' + police + '}}';
}
async function exporter() {
  const C = calcul(), M = manques(C), n = M.liste.length;
  if (n) {
    const ou = CHAPITRES.filter(c => M.parChapitre[c.id]).map(c => c.nav.replace(/^\d\. /, '') + ' (' + M.parChapitre[c.id] + ')').join(', ');
    const ok = await demander('Le dossier est rempli à ' + M.taux + ' %', 'Il manque ' + (n === 1 ? 'un élément' : n + ' éléments') + ' : ' + ou + '. Le PDF affichera « à compléter » à ces endroits.', 'Exporter quand même', 'Voir ce qui manque');
    if (!ok) { const premier = CHAPITRES.find(c => M.parChapitre[c.id]); if (premier && S.chapitre !== premier.id) location.hash = '#' + premier.id; return; }
  }
  preparerImpression();
  const ancien = document.title; document.title = 'TNBIM_' + cheminNom() + '_journal-dossier';
  window.print();
  setTimeout(() => { document.title = ancien; }, 1500);
}
/* Filet de sécurité : un projet effacé reste récupérable sur l'appareil, et son fichier part dans les téléchargements */
const CLE_SECOURS = CLE + '-secours';
function secours() { try { const b = localStorage.getItem(CLE_SECOURS); const d = b ? JSON.parse(b) : null; return d && d.etat && d.etat.app === APP.id ? d : null; } catch (e) { return null; } }
function blocSecours() {
  const d = secours(); if (!d || S.maj) return '';
  const quand = new Date(d.le);
  return `<section class="bloc repere"><h2>Un projet effacé peut être récupéré</h2><p>Un projet a été effacé le ${dateFr(quand)} à ${heure(d.le)}. Il reste disponible sur cet appareil.</p><div class="actions"><button type="button" class="btn plein" data-action="recuperer">Récupérer ce projet</button></div></section>`;
}
function recuperer() {
  const d = secours(); if (!d) return;
  S = Object.assign(nouvelEtat(), d.etat); sauver();
  history.replaceState(null, '', '#' + chapitre(S.chapitre).id); rendre(true); bref('Projet récupéré.');
}
async function nouveau() {
  const travail = !!S.maj;
  const texte = travail ? 'Le fichier de projet part d\'abord dans les téléchargements. Tout le travail affiché est ensuite effacé de cet appareil.' : 'La page repart d\'un projet vide.';
  if (!(await demander('Repartir de zéro ?', texte, 'Tout effacer'))) return;
  if (travail) {
    const le = new Date().toISOString();
    try { localStorage.setItem(CLE_SECOURS, JSON.stringify({ le: le, etat: S })); } catch (e) {}
    telecharger('TNBIM_' + cheminNom() + '_avant-effacement_' + le.slice(0, 10) + '.json', JSON.stringify(S, null, 1), 'application/json');
  }
  S = nouvelEtat(); try { localStorage.removeItem(CLE); } catch (e) {}
  history.replaceState(null, '', '#depart'); rendre(true); bref(travail ? 'Nouveau projet. L\'ancien est dans les téléchargements.' : 'Nouveau projet.');
}
function ouvrir() { $('fichier').value = ''; $('fichier').click(); }
function lireFichier(f) {
  const l = new FileReader();
  l.onload = async () => {
    let d; try { d = JSON.parse(l.result); } catch (e) { d = null; }
    if (!d || d.app !== APP.id || typeof d.champs !== 'object') { bref('Ce fichier n\'est pas un fichier de projet de ce module.'); return; }
    if (S.maj && !(await demander('Ouvrir ce fichier ?', 'Il remplace le travail affiché sur cet appareil.', 'Ouvrir'))) return;
    S = Object.assign(nouvelEtat(), d); sauver();
    history.replaceState(null, '', '#' + chapitre(S.chapitre).id); rendre(true); bref('Projet rouvert.');
  };
  l.readAsText(f);
}

/* Glisser-déposer : le fichier de projet n'importe où sur la page, un fichier de données dans la zone d'essai */
const porteFichier = e => !!(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0);
const dansDepot = e => null;
function finDepose() { $('depose').hidden = true; document.querySelectorAll('.depot.survol').forEach(x => x.classList.remove('survol')); }
let minuteDepose = 0;
document.addEventListener('dragover', e => {
  if (!porteFichier(e)) return;
  e.preventDefault(); clearTimeout(minuteDepose);
  const z = dansDepot(e);
  document.querySelectorAll('.depot.survol').forEach(x => { if (x !== z) x.classList.remove('survol'); });
  if (z) z.classList.add('survol');
  $('depose').hidden = !!z || !!document.querySelector('dialog[open]');
});
/* Safari ne renseigne pas relatedTarget : on masque après une courte pause sans survol */
document.addEventListener('dragleave', () => { clearTimeout(minuteDepose); minuteDepose = setTimeout(finDepose, 150); });
document.addEventListener('drop', e => {
  if (!porteFichier(e)) return;
  e.preventDefault(); clearTimeout(minuteDepose); const z = dansDepot(e); finDepose();
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  if (document.querySelector('dialog[open]')) return;
  if (/\.json$/i.test(f.name)) return lireFichier(f);
  bref('Fichier non reconnu. Pour reprendre le travail, déposez un fichier de projet .json.');
});
/* Rappel d'enregistrement : après beaucoup de modifications, et en fin de demi-journée */
let rappelRepousse = 0;
function verifierRappel() {
  const depuis = (S.modifs || 0) - (S.modifsExport || 0);
  const h = new Date(), m = h.getHours() * 60 + h.getMinutes();
  const finDeSeance = (m >= 735 && m <= 755);
  const montrer = Date.now() > rappelRepousse && ((depuis > 0 && (depuis >= 60 || finDeSeance)) || (finDeSeance && (S.modifs || 0) > 0));
  const fin = montrer && finDeSeance;
  $('rappel-texte').textContent = typo(fin ? `Fin de séance : enregistrez le fichier, puis rangez-le dans le dossier Teams du groupe. Sans lui, vous ne retrouvez pas votre travail à la prochaine session.` : 'Enregistrez le fichier de projet avant de fermer. Le navigateur peut tout perdre.');
  $('rappel-fait').hidden = !fin;
  $('rappel').hidden = !montrer;
}

document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-aide]')) AIDES[d.getAttribute('data-aide')] = d.open; }, true);

/* ───────── Événements ───────── */
let minuteurLeger = null;
document.addEventListener('input', e => {
  const c = e.target.getAttribute && e.target.getAttribute('data-champ');
  if (!c) return;
  S.champs[c] = e.target.value; toucher();
  clearTimeout(minuteurLeger); minuteurLeger = setTimeout(majLeger, 180);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'date' && t.hasAttribute('data-champ')) { S.champs[t.getAttribute('data-champ')] = t.value; toucher(); rendre(false); return; }
  if (t.hasAttribute('data-champ') && /^ps_opt/.test(t.getAttribute('data-champ'))) { rendre(false); return; }
  if (t.id === 'fichier') { if (t.files[0]) lireFichier(t.files[0]); return; }
  if (t.hasAttribute('data-decision')) {
    const id = t.getAttribute('data-decision'); S.choix[id] = t.value; toucher(); rendre(false);
    const r = document.querySelector('[data-decision="' + id + '"][value="' + t.value + '"]'); if (r) r.focus({ preventScroll: true });
    return;
  }
  if (t.hasAttribute('data-fait')) { const id = t.getAttribute('data-fait'); S.faits[id] = t.checked; toucher(); t.closest('.etape').classList.toggle('faite', t.checked); majLeger(); return; }
  if (t.hasAttribute('data-coche')) { S.champs[t.getAttribute('data-coche')] = t.checked ? 'oui' : 'non'; toucher(); majLeger(); return; }
  if (t.tagName === 'SELECT' && t.hasAttribute('data-champ')) {
    const c = t.getAttribute('data-champ'); S.champs[c] = t.value; toucher();
    if (c === 'id_classe') rendre(false); else majLeger();
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-action]'); if (!b) return;
  const a = b.getAttribute('data-action');
  if (a === 'nouveau') return nouveau();
  if (a === 'fiche-md') { telecharger('fiche-chantier-rive-nord.md', cahierChantierMd(), 'text/markdown;charset=utf-8'); return bref('Fiche téléchargée. Vous l\'ajouterez au projet Claude à l\'étape « Régler Claude ».'); }
  if (a === 'fiche-csv') { telecharger('lots-chantier-rive-nord.csv', '\ufeff' + ficheChantierCsv(), 'text/csv;charset=utf-8'); return bref('Fichier des lots téléchargé.'); }
  if (a === 'jb-plus') { S.champs.jb_n = String(Math.min(40, nJournal() + 1)); toucher(); rendre(false); return; }
  if (a === 'ouvrir') return ouvrir();
  if (b.hasAttribute('data-aller-ch')) return allerAncre(b.getAttribute('data-aller-ch'), b.getAttribute('data-aller-ancre'));
  if (a === 'enregistrer') return enregistrer();
  if (a === 'exporter') return exporter();
  if (a === 'recuperer') return recuperer();
  if (a === 'volet-nav') return basculer('nav');
  if (a === 'volet-etat') return basculer('etat');
  if (a === 'copie-faite') { rappelRepousse = Date.now() + 90 * 60000; $('rappel').hidden = true; return bref('Parfait. Le travail est en sécurité.'); }
  if (a === 'plus-tard') { rappelRepousse = Date.now() + 20 * 60000; $('rappel').hidden = true; return; }
  if (b.hasAttribute('data-copier')) {
    const idc = b.getAttribute('data-copier');
    const t = texteConsigne(idc);
    return copier(t, t.indexOf(VIDE) >= 0 ? 'Copié. Attention : il reste des passages à compléter.' : 'Consigne copiée. Collez-la dans Claude.');
  }
  if (b.hasAttribute('data-scene')) {
    const id = b.getAttribute('data-scene'), va = b.getAttribute('data-variante'), rep = b.getAttribute('data-rep');
    S.scenes[id] = S.scenes[id] || {}; S.scenes[id][va] = rep; toucher(); rendre(false);
    const r = document.querySelector('[data-scene="' + id + '"][data-rep="' + rep + '"]'); if (r) r.focus({ preventScroll: true });
    return;
  }
  if (b.hasAttribute('data-radio')) {
    const c = b.getAttribute('data-radio'), val = b.getAttribute('data-valeur'); S.champs[c] = val; toucher(); rendre(false);
    const r = document.querySelector('[data-radio="' + c + '"][data-valeur="' + val + '"]'); if (r) r.focus({ preventScroll: true });
    return;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('depot')) { e.preventDefault(); e.target.click(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && e.code === 'KeyS') { e.preventDefault(); enregistrer(); }
  else if (mod && !e.altKey && e.code === 'KeyE') { e.preventDefault(); exporter(); }
  else if (e.altKey && !mod && e.code === 'KeyN') { e.preventDefault(); nouveau(); }
  else if (e.altKey && !mod && e.code === 'KeyO') { e.preventDefault(); ouvrir(); }
  else if (e.key === 'Escape') fermerVolets();
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (CHAPITRES.some(c => c.id === id)) { if (id !== S.chapitre) allerA(id, true); } });
window.addEventListener('beforeprint', preparerImpression);
/* À la fermeture : dernières saisies écrites tout de suite, et avertissement si le fichier de projet a du retard */
function sauverMaintenant() { if (!aSauver) return; clearTimeout(minuteur); aSauver = false; try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} }
window.addEventListener('pagehide', sauverMaintenant);
window.addEventListener('beforeunload', e => {
  sauverMaintenant();
  if ((S.modifs || 0) - (S.modifsExport || 0) >= 10) { e.preventDefault(); e.returnValue = ''; }
});
setInterval(verifierRappel, 60000);

/* ───────── Démarrage ───────── */
charger();
/* Premier passage : chaque chapitre déclare ses étapes, ses champs et ses choix */
(function () { const C = calcul(); CHAPITRES.forEach(c => { CH = c.id; c.rendu(C); }); })();
(function () { const id = location.hash.slice(1); if (CHAPITRES.some(c => c.id === id)) S.chapitre = id; })();
typoNoeuds(document.querySelector('.barre')); typoNoeuds($('rappel'));
document.querySelectorAll('[title]').forEach(e => e.setAttribute('title', typo(e.getAttribute('title'))));
rendre(true);

})();
</script>
</body>
</html>
